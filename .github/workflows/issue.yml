name: Issue certificates
on:
  push:
    paths: ['input/completions.csv']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab qrcode pillow pymupdf
      - run: python scripts/issue.py
      - run: |
          git config user.name "TeamAcademy Bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Issue certificates"
          git push
